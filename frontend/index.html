<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창원 날씨 AI</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 아이콘 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 커스텀 CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- 헤더 -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand">
                <i class="fas fa-cloud-sun"></i> 창원 날씨 AI
            </span>
            <span id="current-time" class="text-white"></span>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- 현재 날씨 카드 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="weather-card card p-4">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <h2 class="location">
                                <i class="fas fa-map-marker-alt"></i> 창원시
                            </h2>
                            <div class="temperature" id="temperature">--°C</div>
                            <div class="weather-desc" id="weather-desc">날씨 불러오는 중...</div>
                        </div>
                        <div class="col-md-6">
                            <div class="weather-details">
                                <div class="detail-item">
                                    <i class="fas fa-tint"></i>
                                    <span>습도</span>
                                    <strong id="humidity">--%</strong>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-wind"></i>
                                    <span>풍속</span>
                                    <strong id="wind-speed">-- m/s</strong>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-thermometer-half"></i>
                                    <span>체감온도</span>
                                    <strong id="feels-like">--°C</strong>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-eye"></i>
                                    <span>가시거리</span>
                                    <strong id="visibility">-- km</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-refresh mt-3" onclick="loadWeather()">
                        <i class="fas fa-sync-alt"></i> 날씨 새로고침
                    </button>
                </div>
            </div>
        </div>

        <!-- AI 채팅 + 날씨 기록 -->
        <div class="row">

            <!-- AI 채팅 -->
            <div class="col-md-7 mb-4">
                <div class="card chat-card p-3">
                    <h5 class="card-title">
                        <i class="fas fa-robot"></i> AI 날씨 어시스턴트
                    </h5>
                    <div class="chat-messages" id="chat-messages">
                        <div class="message bot-message">
                            <i class="fas fa-robot"></i>
                            안녕하세요! 창원 날씨 AI입니다. 날씨에 대해 무엇이든 물어보세요! 😊
                        </div>
                    </div>
                    <div class="chat-input mt-3">
                        <div class="input-group">
                            <input type="text" class="form-control" id="chat-input"
                                placeholder="날씨에 대해 질문하세요..." 
                                onkeypress="handleEnter(event)">
                            <button class="btn btn-send" onclick="sendMessage()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 날씨 기록 -->
            <div class="col-md-5 mb-4">
                <div class="card p-3">
                    <h5 class="card-title">
                        <i class="fas fa-history"></i> 날씨 기록
                    </h5>
                    <div id="weather-history">
                        <div class="text-center text-muted py-3">
                            <i class="fas fa-spinner fa-spin"></i> 불러오는 중...
                        </div>
                    </div>
                    <button class="btn btn-sm btn-outline-primary mt-2" onclick="loadHistory()">
                        <i class="fas fa-sync-alt"></i> 새로고침
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 커스텀 JS -->
    <script src="js/app.js"></script>
</body>
</html>
